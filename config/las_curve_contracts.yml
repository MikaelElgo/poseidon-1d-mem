        description_name: "RHOB"
        raw_canonical_name: "RHOB_g_per_cm3"
        canonical_name: "RHOB_kg_m3"
        canonical_unit: "kg/m3"
        required: true
        conversion_function: "gcc_to_kgm3"
        notes: >
          Bulk density, converted via the exact p2mem.units.gcc_to_kgm3
